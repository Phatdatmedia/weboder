<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="canonical" href="https://smm.phatdatagency.id.vn/">
  <title>Đang đồng bộ tài khoản</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e8;color:#211b17;font-family:Arial,sans-serif}
    main{text-align:center;padding:32px}
    .loader{width:34px;height:34px;margin:0 auto 18px;border:3px solid #ddd2c2;border-top-color:#e34a30;border-radius:50%;animation:spin .8s linear infinite}
    p{margin:8px 0;color:#6f675e}
    a{color:#c63d29}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="loader" aria-hidden="true"></div>
    <strong>Đang đồng bộ tài khoản và ví…</strong>
    <p>Bạn sẽ được chuyển sang trang đặt đơn ngay.</p>
    <noscript><a href="https://smm.phatdatagency.id.vn/">Tiếp tục đến trang đặt đơn</a></noscript>
  </main>

  <script>
  (() => {
    'use strict';

    const SMM_ORIGIN = 'https://smm.phatdatagency.id.vn';
    const SUPABASE_URL = 'https://npsylbxggliczhtnzzgl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wc3lsYnhnZ2xpY3podG56emdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTg0NTcsImV4cCI6MjA5ODQ3NDQ1N30.sSe3zD5A2EjOnwTmGLAifzPGOn0xQwMSYTqXbAKZrig';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let redirected = false;

    function getSafeDestination(){
      const requested = new URLSearchParams(location.search).get('return');
      if(requested){
        try{
          const url = new URL(requested);
          if(url.origin === SMM_ORIGIN){
            url.hash = '';
            return url;
          }
        } catch(e){ /* dùng URL mặc định */ }
      }
      return new URL(SMM_ORIGIN + '/');
    }

    function encodeSession(session){
      return btoa(JSON.stringify({
        access_token: session.access_token,
        refresh_token: session.refresh_token
      })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function redirectToSmm(authState, session){
      if(redirected) return;
      redirected = true;
      const destination = getSafeDestination();
      destination.hash = session
        ? 'pda_session=' + encodeSession(session)
        : 'pda_auth=' + authState;
      location.replace(destination.toString());
    }

    window.setTimeout(() => redirectToSmm('unavailable', null), 6000);

    client.auth.getSession()
      .then(({ data, error }) => {
        if(error) throw error;
        const session = data?.session;
        redirectToSmm(session ? 'authenticated' : 'guest', session || null);
      })
      .catch(() => redirectToSmm('unavailable', null));
  })();
  </script>
</body>
</html>
