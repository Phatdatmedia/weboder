<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập quản trị — Vặt Ơi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<main class="container">
  <form class="panel" id="admin-login-form">
    <h1>Quản trị viên</h1>
    <div class="alert" id="admin-login-alert"></div>
    <div class="field">
      <label for="a-email">Email</label>
      <input type="email" id="a-email" required>
    </div>
    <div class="field">
      <label for="a-password">Mật khẩu</label>
      <input type="password" id="a-password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
    <p class="form-note"><a href="../index.html">← Về trang chủ</a></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
