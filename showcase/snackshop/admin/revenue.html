<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doanh thu — Vặt Ơi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-topbar">
  <div class="container">
    <a href="products.html" class="logo" data-site-logo>Vặt<span>Ơi</span></a> <span class="admin-brand-tag">Admin</span>
    <nav>
      <ul class="admin-nav">
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="orders.html">Đơn hàng</a></li>
        <li><a href="payments.html">Thanh toán</a></li>
        <li><a href="revenue.html" class="active">Doanh thu</a></li>
      </ul>
    </nav>
    <div>
      <span data-admin-name style="margin-right:14px;"></span>
      <button class="btn btn-outline btn-sm" id="admin-logout">Đăng xuất</button>
    </div>
  </div>
</header>

<main class="container admin-main">
  <h1>Doanh thu</h1>
  <p style="color:rgba(58,42,26,0.65); margin-top:-8px;">Chỉ tính các đơn đã đánh dấu <strong>Đã thanh toán</strong>.</p>

  <div class="stat-cards">
    <div class="stat-card stat-card-accent">
      <div class="stat-label">Tổng doanh thu toàn bộ</div>
      <div class="stat-value" id="stat-all-time">—</div>
      <div class="stat-sub" id="stat-all-time-count">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" id="stat-month-label">Doanh thu tháng này</div>
      <div class="stat-value" id="stat-this-month">—</div>
      <div class="stat-sub" id="stat-this-month-count">—</div>
    </div>
  </div>

  <div class="admin-table-wrap" style="padding:24px; margin-top:28px;">
    <canvas id="revenue-chart" height="90"></canvas>
  </div>

  <div class="admin-table-wrap" style="margin-top:24px;">
    <table class="data-table">
      <thead>
        <tr><th>Tháng</th><th>Số đơn</th><th>Doanh thu</th></tr>
      </thead>
      <tbody id="revenue-tbody"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../js/supabase-client.js"></script>
<script src="admin.js"></script>
<script>initRevenuePage();</script>
</body>
</html>
