<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — PC.STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/showcase/pcstore-single/" class="logo"><span class="dot"></span>PC<span class="mono">.STORE</span></a>
  </div>
</header>

<form class="form-card" id="register-form">
  <h2>Tạo tài khoản</h2>
  <div id="error-box"></div>
  <div class="field"><label>Họ và tên</label><input id="f-name" required></div>
  <div class="field"><label>Email</label><input type="email" id="f-email" required></div>
  <div class="field"><label>Mật khẩu (tối thiểu 6 ký tự)</label><input type="password" id="f-password" minlength="6" required></div>
  <button class="btn btn--primary btn--full" type="submit">Đăng ký</button>
  <div class="form-alt">Đã có tài khoản? <a href="/showcase/pcstore-single/login/">Đăng nhập</a></div>
</form>

<script src="script.js"></script>
</body>
</html>
