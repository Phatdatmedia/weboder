<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — PC.STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="/showcase/pcstore-single/" class="logo"><span class="dot"></span>PC<span class="mono">.STORE</span></a>
  </div>
</header>

<form class="form-card" id="login-form">
  <h2>Đăng nhập</h2>
  <div id="error-box"></div>
  <div class="field"><label>Email</label><input type="email" id="f-email" required></div>
  <div class="field"><label>Mật khẩu</label><input type="password" id="f-password" required></div>
  <button class="btn btn--primary btn--full" type="submit">Đăng nhập</button>
  <div class="form-alt">Chưa có tài khoản? <a href="/showcase/pcstore-single/register/">Đăng ký ngay</a></div>
</form>

<script src="script.js"></script>
</body>
</html>
