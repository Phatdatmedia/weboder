<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sản phẩm — PC.STORE Admin</title>
<style>
/* =========================================================
   PC STORE — DESIGN TOKENS
   Chủ đề: bảng thông số linh kiện / PCB, tối giản, kỹ thuật
========================================================= */
:root {
  --bg: #10121A;
  --panel: #191C26;
  --panel-2: #21252F;
  --line: #2C303C;
  --text: #E7E9EE;
  --muted: #8B93A7;
  --cyan: #57E8CB;
  --amber: #FFB020;
  --danger: #FF6B6B;
  --radius: 6px;
  --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
}

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0 0 .5em; }
.mono { font-family: var(--font-mono); }

.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* ---------- HEADER ---------- */
.site-header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(16,18,26,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.header-inner { display: flex; align-items: center; gap: 24px; height: 68px; }
.logo { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.nav-search { flex: 1; max-width: 420px; }
.nav-search input {
  width: 100%; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-family: var(--font-mono); font-size: .9rem;
}
.nav-search input::placeholder { color: var(--muted); }
.nav-links { display: flex; align-items: center; gap: 18px; margin-left: auto; }
.nav-link { color: var(--muted); font-weight: 500; font-size: .92rem; transition: color .15s; white-space: nowrap; }
.nav-link:hover { color: var(--text); }
.nav-link--staff { color: var(--amber); }
.nav-link--btn { background: none; border: none; color: var(--muted); font-size: .92rem; }
.nav-link--btn:hover { color: var(--danger); }
.cart-badge {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
}
.cart-count {
  background: var(--cyan); color: #0A0C11; font-family: var(--font-mono);
  font-size: .7rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 4px;
}

/* ---------- CATEGORY BAR ---------- */
.category-bar { display: flex; gap: 10px; overflow-x: auto; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chip {
  font-family: var(--font-mono); font-size: .8rem; padding: 6px 14px;
  border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap;
  transition: all .15s;
}
.chip:hover, .chip.active { border-color: var(--cyan); color: var(--cyan); }

/* ---------- HERO ---------- */
.hero {
  border-bottom: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(87,232,203,0.06), transparent 60%),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.025) 40px);
  padding: 56px 0 40px;
}
.hero-eyebrow { font-family: var(--font-mono); color: var(--cyan); font-size: .8rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); max-width: 700px; }
.hero p { color: var(--muted); max-width: 560px; margin-bottom: 20px; }
.hero-specs { display: flex; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
.hero-spec-label { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.hero-spec-value { font-family: var(--font-mono); font-size: 1.3rem; color: var(--text); font-weight: 600; }

/* ---------- PRODUCT GRID ---------- */
.section { padding: 40px 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
.sort-select {
  font-family: var(--font-mono); background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: .85rem;
}
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

.product-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  position: relative; overflow: hidden; transition: border-color .15s, transform .15s;
  display: flex; flex-direction: column;
}
.product-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
.product-card::before, .product-card::after {
  content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--line);
  opacity: 0; transition: opacity .15s;
}
.product-card::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.product-card::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }
.product-card:hover::before, .product-card:hover::after { opacity: 1; border-color: var(--cyan); }

.product-thumb { aspect-ratio: 1/1; background: var(--panel-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.product-thumb img { width: 100%; height: 100%; object-fit: cover; }
.product-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.product-cat { font-family: var(--font-mono); font-size: .68rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }
.product-name { font-size: .95rem; font-weight: 600; min-height: 2.6em; }
.product-specs { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--font-mono); font-size: .68rem; color: var(--muted); }
.product-price-row { margin-top: auto; display: flex; align-items: baseline; gap: 8px; }
.product-price { font-family: var(--font-mono); font-weight: 700; color: var(--text); font-size: 1.05rem; }
.product-price--old { font-family: var(--font-mono); color: var(--muted); text-decoration: line-through; font-size: .8rem; }
.stock-tag { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); }
.stock-tag--out { color: var(--danger); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: var(--radius); border: 1px solid var(--line); padding: 10px 16px;
  font-weight: 600; font-size: .88rem; background: var(--panel-2); color: var(--text);
  transition: all .15s;
}
.btn:hover { border-color: var(--cyan); }
.btn--primary { background: var(--cyan); color: #0A0C11; border-color: var(--cyan); }
.btn--primary:hover { filter: brightness(1.08); }
.btn--danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn--full { width: 100%; }
.btn--sm { padding: 6px 10px; font-size: .78rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---------- FORMS ---------- */
.form-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; max-width: 420px; margin: 40px auto; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; font-family: var(--font-mono); }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font-size: .92rem; font-family: var(--font-body);
}
.field textarea { resize: vertical; min-height: 80px; }
.form-alt { text-align: center; margin-top: 14px; font-size: .88rem; color: var(--muted); }
.form-alt a { color: var(--cyan); font-weight: 600; }
.form-error { background: rgba(255,107,107,.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px 12px; border-radius: var(--radius); font-size: .85rem; margin-bottom: 14px; }

/* ---------- PRODUCT DETAIL ---------- */
.pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.pd-image { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); aspect-ratio: 1/1; overflow: hidden; }
.pd-image img { width: 100%; height: 100%; object-fit: cover; }
.pd-title { font-size: 1.6rem; }
.pd-price { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; color: var(--cyan); margin: 10px 0; }
.spec-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-family: var(--font-mono); font-size: .85rem; }
.spec-table tr { border-bottom: 1px solid var(--line); }
.spec-table td { padding: 9px 4px; }
.spec-table td:first-child { color: var(--muted); width: 40%; }
.qty-stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); width: fit-content; }
.qty-stepper button { background: none; border: none; color: var(--text); width: 34px; height: 34px; font-size: 1rem; }
.qty-stepper input { width: 46px; text-align: center; border: none; background: none; color: var(--text); font-family: var(--font-mono); }

/* ---------- CART / CHECKOUT ---------- */
.cart-row { display: grid; grid-template-columns: 64px 1fr auto auto auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.cart-row img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); background: var(--panel-2); }
.cart-thumb-name { font-weight: 600; font-size: .9rem; }
.cart-line-price { font-family: var(--font-mono); color: var(--cyan); font-weight: 700; }
.summary-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; position: sticky; top: 90px; }
.summary-row { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 10px; color: var(--muted); }
.summary-row--total { color: var(--text); font-weight: 700; font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.summary-row--total .mono { color: var(--cyan); }

.pay-options { display: flex; flex-direction: column; gap: 10px; }
.pay-option { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; }
.pay-option:has(input:checked) { border-color: var(--cyan); background: rgba(87,232,203,.06); }

/* ---------- ORDER TRACKING ---------- */
.track-steps { display: flex; justify-content: space-between; margin: 30px 0; position: relative; }
.track-steps::before { content: ""; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--line); z-index: 0; }
.track-step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
.track-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.track-step.done .track-dot { background: var(--cyan); border-color: var(--cyan); color: #0A0C11; }
.track-step.done ~ .track-step::before { }
.track-label { font-size: .72rem; color: var(--muted); font-family: var(--font-mono); text-align: center; }
.track-step.done .track-label { color: var(--text); }

.order-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.order-card-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.badge { font-family: var(--font-mono); font-size: .72rem; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
.badge--pending { background: rgba(255,176,32,.15); color: var(--amber); }
.badge--confirmed, .badge--packing { background: rgba(87,232,203,.15); color: var(--cyan); }
.badge--shipping { background: rgba(87,232,203,.25); color: var(--cyan); }
.badge--delivered { background: rgba(87,232,203,.35); color: #0A0C11; background-color: var(--cyan); }
.badge--cancelled { background: rgba(255,107,107,.15); color: var(--danger); }

/* ---------- ADMIN ---------- */
.admin-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.admin-side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 0; }
.admin-side .logo { padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.admin-nav a { display: block; padding: 11px 20px; color: var(--muted); font-size: .9rem; font-weight: 500; border-left: 3px solid transparent; }
.admin-nav a:hover { color: var(--text); }
.admin-nav a.active { color: var(--cyan); border-left-color: var(--cyan); background: rgba(87,232,203,.05); }
.admin-main { padding: 28px 32px; }
.admin-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.stat-card .label { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); text-transform: uppercase; }
.stat-card .value { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; margin-top: 6px; }

table.data-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.data-table th, table.data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: .86rem; }
table.data-table th { font-family: var(--font-mono); font-size: .72rem; text-transform: uppercase; color: var(--muted); background: var(--panel-2); }
table.data-table tr:last-child td { border-bottom: none; }
.table-actions { display: flex; gap: 8px; }
select.status-select { font-family: var(--font-mono); background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; font-size: .8rem; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; }

/* ---------- TOAST ---------- */
.toast-box { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
  padding: 12px 18px; border-radius: var(--radius); font-size: .88rem; opacity: 0; transform: translateY(8px);
  transition: all .25s; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast--error { border-left-color: var(--danger); }
.toast--success { border-left-color: var(--cyan); }

/* ---------- FOOTER ---------- */
.site-footer { border-top: 1px solid var(--line); padding: 32px 0; margin-top: 60px; color: var(--muted); font-size: .85rem; }

/* ---------- EMPTY STATE ---------- */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state h3 { color: var(--text); }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 860px) {
  .pd-grid { grid-template-columns: 1fr; }
  .admin-shell { grid-template-columns: 1fr; }
  .admin-side { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; overflow-x: auto; padding: 10px 0; }
  .admin-side .logo { border: none; padding: 0 14px; }
  .admin-nav { display: flex; }
  .admin-nav a { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .admin-nav a.active { border-left-color: transparent; border-bottom-color: var(--cyan); }
  .cart-row { grid-template-columns: 50px 1fr; grid-template-areas: "img name" "img price" "img qty"; }
  .nav-search { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
</head>

<div class="admin-shell">
  <aside class="admin-side">
    <div class="logo"><span class="dot"></span>PC<span class="mono">.ADMIN</span></div>
    <nav class="admin-nav">

      <a href="staff.html">Nhân viên</a>

  </aside>
  <main class="admin-main">

    <table class="data-table">
      <thead><tr><th>Ảnh</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="product-tbody"></tbody>
    </table>

</div>

<div class="modal-backdrop" id="modal" style="display:none;">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">Thêm sản phẩm</h3><button class="modal-close" id="modal-close">×</button></div>
    <form id="product-form">
      <input type="hidden" id="f-id">
      <div class="field"><label>Tên sản phẩm</label><input id="f-name" required></div>
      <div class="field"><label>Slug (URL, không dấu, cách nhau bằng -)</label><input id="f-slug" required></div>
      <div class="field"><label>Danh mục</label><select id="f-category"></select></div>
      <div class="field"><label>Thương hiệu</label><input id="f-brand"></div>

      <div class="field"><label>Tồn kho</label><input type="number" id="f-stock" required></div>
      <div class="field"><label>Link ảnh</label><input id="f-image"></div>
      <div class="field"><label>Thông số kỹ thuật (JSON, VD: {"CPU":"i7-14700K"})</label><textarea id="f-specs">{}</textarea></div>
      <div class="field"><label>Mô tả</label><textarea id="f-description"></textarea></div>
      <div class="field"><label><input type="checkbox" id="f-active" checked style="width:auto;"> Đang bán</label></div>
      <button class="btn btn--primary btn--full" type="submit">Lưu sản phẩm</button>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// =========================================================
// ⚠️ CẤU HÌNH SUPABASE — điền URL và ANON KEY của bạn tại đây
// Lấy tại: Supabase Dashboard > Project Settings > API
// =========================================================
const SUPABASE_URL = "https://ajodavrshmkunztjjbot.supabase.co/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqb2RhdnJzaG1rdW56dGpqYm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjAyODcsImV4cCI6MjA5OTkzNjI4N30.IxQJLP7xX6CqBsobJeubQunzssDSwF0Rjucj1pwRk08";
const SHIPPING_FEE = 30000;           // phí ship mặc định (VND)
const FREE_SHIP_THRESHOLD = 5000000;  // miễn phí ship nếu đơn >= giá trị này

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

// ---- ui.js ----
function formatVND(n) {
  if (n === null || n === undefined) return "0₫";
  return Number(n).toLocaleString("vi-VN") + "₫";
}

function toast(message, type = "info") {
  let box = document.getElementById("toast-box");
  if (!box) {
    box = document.createElement("div");
    box.id = "toast-box";
    box.className = "toast-box";
    document.body.appendChild(box);
  }
  const el = document.createElement("div");
  el.className = `toast toast--${type}`;
  el.textContent = message;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function qs(sel, el = document) { return el.querySelector(sel); }
function qsa(sel, el = document) { return [...el.querySelectorAll(sel)]; }

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

// ---- auth.js ----

async function signUp({ email, password, fullName }) {
  const { data, error } = await supabase.auth.signUp({
    email, password,
    options: { data: { full_name: fullName } },
  });
  if (error) throw error;
  return data;
}

async function signIn({ email, password }) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  return data;
}

async function signOut() {

}

async function getCurrentUser() {
  const { data: { user } } = await supabase.auth.getUser();
  return user;
}

async function getProfile(userId) {
  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .single();
  if (error) return null;
  return data;
}

// Bắt buộc đăng nhập — chuyển hướng nếu chưa đăng nhập
async function requireAuth(redirect = "login.html") {
  const user = await getCurrentUser();
  if (!user) {
    window.location.href = redirect;
    return null;
  }
  return user;
}

// Bắt buộc quyền nhân viên/admin — dùng cho khu vực /admin
async function requireStaff(redirect = "../login.html") {
  const user = await getCurrentUser();
  if (!user) { window.location.href = redirect; return null; }
  const profile = await getProfile(user.id);
  if (!profile || !["staff", "admin"].includes(profile.role)) {
    toast("Bạn không có quyền truy cập khu vực này", "error");
    window.location.href = "../index.html";
    return null;
  }
  return { user, profile };
}

// Vẽ header dùng chung: cập nhật trạng thái đăng nhập, số lượng giỏ hàng
async function mountHeaderAuthState({ cartCountEl, userSlotEl } = {}) {
  const user = await getCurrentUser();
  if (userSlotEl) {
    if (user) {
      const profile = await getProfile(user.id);
      const isStaff = profile && ["staff", "admin"].includes(profile.role);
      userSlotEl.innerHTML = `
        <a href="${location.pathname.includes('/admin') ? '../' : ''}account.html" class="nav-link">👤 ${profile?.full_name || "Tài khoản"}</a>
        ${isStaff ? `<a href="${location.pathname.includes('/admin') ? '' : 'admin/'}index.html" class="nav-link nav-link--staff">Quản trị</a>` : ""}
        <button class="nav-link nav-link--btn" id="btn-logout">Đăng xuất</button>
      `;
      document.getElementById("btn-logout")?.addEventListener("click", async () => {
        await signOut();
        window.location.href = location.pathname.includes('/admin') ? "../login.html" : "login.html";
      });
    } else {
      userSlotEl.innerHTML = `<a href="login.html" class="nav-link">Đăng nhập</a>`;
    }
  }
  return user;
}

// ---- cart.js ----

async function getCartItems(userId) {
  const { data, error } = await supabase
    .from("cart_items")
    .select("id, quantity, product_id, products(id, name, price, sale_price, image_url, stock)")
    .eq("user_id", userId)
    .order("created_at", { ascending: true });
  if (error) throw error;
  return data;
}

async function getCartCount(userId) {
  if (!userId) return 0;
  const { count, error } = await supabase
    .from("cart_items")
    .select("id", { count: "exact", head: true })
    .eq("user_id", userId);
  if (error) return 0;
  return count || 0;
}

async function addToCart(userId, productId, quantity = 1) {
  // Nếu sản phẩm đã có trong giỏ, cộng dồn số lượng
  const { data: existing } = await supabase
    .from("cart_items").select("id, quantity")
    .eq("user_id", userId).eq("product_id", productId).maybeSingle();

  if (existing) {
    const { error } = await supabase
      .from("cart_items").update({ quantity: existing.quantity + quantity })
      .eq("id", existing.id);
    if (error) throw error;
  } else {
    const { error } = await supabase
      .from("cart_items").insert({ user_id: userId, product_id: productId, quantity });
    if (error) throw error;
  }
}

async function updateCartQuantity(cartItemId, quantity) {
  if (quantity <= 0) return removeCartItem(cartItemId);
  const { error } = await supabase.from("cart_items").update({ quantity }).eq("id", cartItemId);
  if (error) throw error;
}

async function removeCartItem(cartItemId) {
  const { error } = await supabase.from("cart_items").delete().eq("id", cartItemId);
  if (error) throw error;
}

async function clearCart(userId) {
  const { error } = await supabase.from("cart_items").delete().eq("user_id", userId);
  if (error) throw error;
}

function cartLineTotal(item) {
  const price = item.products.sale_price ?? item.products.price;
  return price * item.quantity;
}

async function fetchCategories() {
  const { data, error } = await supabase.from("categories").select("*").order("name");
  if (error) throw error;
  return data;
}

async function fetchProducts({ categorySlug, search, sort, limit = 60 } = {}) {
  let query = supabase.from("products").select("*, categories(name, slug)").eq("is_active", true);

  if (categorySlug) {
    const { data: cat } = await supabase.from("categories").select("id").eq("slug", categorySlug).single();
    if (cat) query = query.eq("category_id", cat.id);
  }
  if (search) query = query.ilike("name", `%${search}%`);

  switch (sort) {
    case "price_asc": query = query.order("price", { ascending: true }); break;
    case "price_desc": query = query.order("price", { ascending: false }); break;
    case "newest": query = query.order("created_at", { ascending: false }); break;
    default: query = query.order("created_at", { ascending: false });
  }

  const { data, error } = await query.limit(limit);
  if (error) throw error;
  return data;
}

// Tạo đơn hàng từ giỏ hàng hiện tại
async function placeOrder({ userId, cartItems, receiver, paymentMethod, note }) {
  const subtotal = cartItems.reduce((sum, it) => sum + (it.products.sale_price ?? it.products.price) * it.quantity, 0);
  const shippingFee = subtotal >= FREE_SHIP_THRESHOLD ? 0 : SHIPPING_FEE;
  const total = subtotal + shippingFee;

  const { data: order, error: orderErr } = await supabase.from("orders").insert({
    user_id: userId,
    subtotal, shipping_fee: shippingFee, total,
    receiver_name: receiver.name,
    receiver_phone: receiver.phone,
    receiver_address: receiver.address,
    payment_method: paymentMethod,
    note: note || null,
  }).select().single();
  if (orderErr) throw orderErr;

  const items = cartItems.map((it) => ({
    order_id: order.id,
    product_id: it.products.id,
    product_name: it.products.name,
    unit_price: it.products.sale_price ?? it.products.price,
    quantity: it.quantity,
  }));
  const { error: itemsErr } = await supabase.from("order_items").insert(items);
  if (itemsErr) throw itemsErr;

  // Ghi nhận giao dịch thanh toán (mô phỏng — COD sẽ ở trạng thái pending tới khi giao)
  await supabase.from("payments").insert({
    order_id: order.id,
    amount: total,
    method: paymentMethod,
    status: paymentMethod === "cod" ? "pending" : "success",
  });
  if (paymentMethod !== "cod") {
    await supabase.from("orders").update({ payment_status: "paid" }).eq("id", order.id);
  }

  // Xoá giỏ hàng sau khi đặt
  await supabase.from("cart_items").delete().eq("user_id", userId);

  return order;
}

async function fetchMyOrders(userId) {
  const { data, error } = await supabase
    .from("orders")
    .select("*, order_items(*)")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });
  if (error) throw error;
  return data;
}

async function fetchOrderByCode(code, userId) {
  let query = supabase.from("orders").select("*, order_items(*), order_status_history(*)").eq("code", code);
  if (userId) query = query.eq("user_id", userId);
  const { data, error } = await query.single();
  if (error) throw error;
  data.order_status_history?.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  return data;
}

async function cancelMyOrder(orderId) {
  const { error } = await supabase.from("orders")
    .update({ status: "cancelled" }).eq("id", orderId).eq("status", "pending");
  if (error) throw error;
}

let categories = [];

  function openModal(product = null) {
    document.getElementById("modal-title").textContent = product ? "Sửa sản phẩm" : "Thêm sản phẩm";
    document.getElementById("f-id").value = product?.id || "";
    document.getElementById("f-name").value = product?.name || "";
    document.getElementById("f-slug").value = product?.slug || "";
    document.getElementById("f-brand").value = product?.brand || "";
    document.getElementById("f-price").value = product?.price || "";
    document.getElementById("f-sale-price").value = product?.sale_price || "";
    document.getElementById("f-stock").value = product?.stock ?? 0;
    document.getElementById("f-image").value = product?.image_url || "";
    document.getElementById("f-specs").value = JSON.stringify(product?.specs || {}, null, 2);
    document.getElementById("f-description").value = product?.description || "";
    document.getElementById("f-active").checked = product ? product.is_active : true;
    document.getElementById("f-category").value = product?.category_id || "";
    document.getElementById("modal").style.display = "flex";
  }
  document.getElementById("new-product-btn").addEventListener("click", () => openModal());
  document.getElementById("modal-close").addEventListener("click", () => document.getElementById("modal").style.display = "none");

  document.getElementById("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    let specs = {};
    try { specs = JSON.parse(document.getElementById("f-specs").value || "{}"); }
    catch { toast("Thông số kỹ thuật phải là JSON hợp lệ", "error"); return; }

    const payload = {
      name: document.getElementById("f-name").value.trim(),
      slug: document.getElementById("f-slug").value.trim(),
      category_id: document.getElementById("f-category").value || null,
      brand: document.getElementById("f-brand").value.trim(),
      price: Number(document.getElementById("f-price").value),
      sale_price: document.getElementById("f-sale-price").value ? Number(document.getElementById("f-sale-price").value) : null,
      stock: Number(document.getElementById("f-stock").value),
      image_url: document.getElementById("f-image").value.trim(),
      specs, description: document.getElementById("f-description").value.trim(),
      is_active: document.getElementById("f-active").checked,
    };
    const id = document.getElementById("f-id").value;
    if (id) payload.id = id;

    try {
      await adminUpsertProduct(payload);
      toast("Đã lưu sản phẩm", "success");
      document.getElementById("modal").style.display = "none";
      loadProducts();
    } catch (err) { toast(err.message, "error"); }
  });

  function productRow(p) {
    return el("tr", {}, [
      el("td", {}, el("img", { src: p.image_url || "https://placehold.co/50x50/191C26/57E8CB?text=PC", style: "width:44px;height:44px;object-fit:cover;border-radius:4px;" })),
      el("td", {}, p.name),
      el("td", {}, p.categories?.name || "—"),
      el("td", { class: "mono" }, formatVND(p.sale_price ?? p.price)),
      el("td", { class: "mono" }, String(p.stock)),
      el("td", {}, el("span", { class: `badge badge--${p.is_active ? "confirmed" : "cancelled"}` }, p.is_active ? "Đang bán" : "Ẩn")),
      el("td", { class: "table-actions" }, [
        el("button", { class: "btn btn--sm", onclick: () => openModal(p) }, "Sửa"),
        el("button", { class: "btn btn--danger btn--sm", onclick: async () => {
          if (!confirm("Xoá sản phẩm này?")) return;
          try { await adminDeleteProduct(p.id); toast("Đã xoá", "success"); loadProducts(); }
          catch (err) { toast(err.message, "error"); }
        } }, "Xoá"),
      ]),
    ]);
  }

  async function loadProducts() {
    const tbody = document.getElementById("product-tbody");
    tbody.innerHTML = `<tr><td colspan="7">Đang tải...</td></tr>`;
    const products = await adminFetchAllProducts();
    tbody.innerHTML = "";
    for (const p of products) tbody.appendChild(productRow(p));
  }

  async function init() {
    const ctx = await requireStaff();
    if (!ctx) return;
    mountHeaderAuthState({});
    categories = await fetchCategories();
    const select = document.getElementById("f-category");
    select.innerHTML = `<option value="">— Chọn danh mục —</option>` + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    loadProducts();
  }
  init();
</script>
