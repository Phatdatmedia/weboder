<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng — PC.STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/showcase/pcstore-single/" class="logo"><span class="dot"></span>PC<span class="mono">.STORE</span></a>
    <div class="nav-search"><input type="search" id="search-input" placeholder="Tìm CPU, VGA, RAM..."></div>
    <nav class="nav-links" id="user-slot"></nav>
    <a href="/showcase/pcstore-single/cart/" class="nav-link cart-badge">🛒 Giỏ hàng <span class="cart-count" id="cart-count">0</span></a>
  </div>
</header>

<section class="section container">
  <h1>Giỏ hàng của bạn</h1>
  <div style="display:grid; grid-template-columns: 1fr 320px; gap: 30px; align-items:start;" id="cart-layout">
    <div id="cart-list"></div>
    <div class="summary-box">
      <div class="summary-row"><span>Tạm tính</span><span class="mono" id="sum-subtotal">0₫</span></div>
      <div class="summary-row"><span>Phí vận chuyển</span><span class="mono" id="sum-ship">0₫</span></div>
      <div class="summary-row summary-row--total"><span>Tổng cộng</span><span class="mono" id="sum-total">0₫</span></div>
      <a href="/showcase/pcstore-single/checkout/" class="btn btn--primary btn--full" id="checkout-btn">Tiến hành thanh toán</a>
    </div>
  </div>
</section>

<footer class="site-footer"><div class="container">PC.STORE — Demo website bán PC. © 2026.</div></footer>

<script src="script.js"></script>
</body>
</html>
