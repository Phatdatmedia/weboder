<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi đơn hàng — PC.STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/showcase/pcstore-single/" class="logo"><span class="dot"></span>PC<span class="mono">.STORE</span></a>
    <nav class="nav-links" id="user-slot" style="margin-left:auto;"></nav>
  </div>
</header>

<section class="section container" style="max-width:720px;">
  <h1>Theo dõi đơn hàng</h1>
  <div style="display:flex; gap:10px; margin-bottom:24px;">
    <input id="code-input" placeholder="Nhập mã đơn hàng, VD: PC260718..." style="flex:1; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-family:var(--font-mono);">
    <button class="btn btn--primary" id="track-btn">Tra cứu</button>
  </div>
  <div id="result"></div>
</section>

<script src="script.js"></script>
</body>
</html>
