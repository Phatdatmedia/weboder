<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập — Hệ thống Bài tập</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/showcase/qlbt/css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Hệ thống giao bài tập</span>
    <h1>Đăng nhập</h1>
    <p>Dùng email và mật khẩu đã đăng ký để tiếp tục.</p>

    <form id="loginForm" autocomplete="off">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" />

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit" class="btn btn-primary" id="loginBtn">Đăng nhập</button>
    </form>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <p style="margin-top:20px; font-size:.85rem; text-align:center;">
      Chưa có tài khoản? <a href="/showcase/qlbt/register/">Đăng ký</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/showcase/qlbt/js/config.js"></script>
<script src="/showcase/qlbt/js/supabaseClient.js"></script>
<script src="/showcase/qlbt/js/utils.js"></script>
<script src="script.js"></script>
</body>
</html>
